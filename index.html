<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Shareable by link, but kept out of search engines. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>VJBL results</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --card: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #75736d;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, .10);
  --accent: #2a78d6; --accent-wash: rgba(42, 120, 214, .10); --other: #c3c2b7;
  --good: #006300; --bad: #c22f2f;
  /* Colours for clubs picked to compare (the app's club colours, in the same order). */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, .10);
    --accent: #3987e5; --accent-wash: rgba(57, 135, 229, .16); --other: #52514e;
    --good: #0ca30c; --bad: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
    --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.top {
  position: sticky; top: 0; z-index: 5; background: var(--card);
  border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top);
}
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; max-width: 1100px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 17px; flex: 1; white-space: nowrap; }
.bar select { max-width: min(52vw, 260px); }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; max-width: 1100px; margin: 0 auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; padding: 9px 10px 10px; color: var(--ink2); text-decoration: none;
  border-bottom: 2px solid transparent; font-weight: 500;
}
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; }
h1 { font-size: 22px; margin: 4px 0 10px; }
h2 { font-size: 17px; margin: 22px 0 8px; }
.sub { color: var(--ink2); font-size: 13px; margin: 0 0 12px; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; margin-bottom: 12px; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink2); }
select, input[type=search], input[type=number] {
  width: 100%; min-height: 40px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card);
}
.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 40px; }
.seg button { border: 0; background: var(--card); padding: 0 12px; cursor: pointer; color: var(--ink2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 4px 0 6px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--ink2); }
.tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
.note { color: var(--ink2); font-size: 13px; margin: 6px 0 12px; }
.info { background: var(--accent-wash); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0 12px; }
.day { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 16px 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.game { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.game .meta, .game .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink2); }
.game .foot { margin-top: 6px; }
.game .foot a { white-space: nowrap; }
.game .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
.game .row .score { font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: right; }
.game .row.won { font-weight: 650; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); }
.badge.W { color: var(--good); } .badge.L { color: var(--bad); }
.link { cursor: pointer; text-decoration: none; color: inherit; }
.link:hover { text-decoration: underline; }
.mine { color: var(--accent); }
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-size: 12px; color: var(--ink2); font-weight: 600; position: sticky; top: 0; background: var(--card); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--accent-wash); }
tr.click { cursor: pointer; }
.small { font-size: 12px; color: var(--ink2); }
@media (max-width: 640px) {
  .wide { display: none; }
  th, td { padding: 8px 7px; }
  .tabs a { padding: 9px 8px 10px; }
}
.more { display: block; margin: 12px auto; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; }
.barcell { min-width: 110px; }
.rbar { position: relative; height: 10px; background: transparent; }
.rbar .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.rbar .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--other); }
.rbar .fill.mine { background: var(--accent); }
.chart { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.chart .lbl { fill: var(--ink2); font-size: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin: 6px 4px 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.pick { min-height: 22px; font-size: 13px; color: var(--ink2); margin: 6px 4px 0; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 16px 30px; }
.back { display: inline-block; margin-bottom: 6px; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tile .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.btn { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; white-space: nowrap; }
/* Clubs: attack v defence chart beside the comparison, on wide screens. */
.duo { display: grid; gap: 12px; }
@media (min-width: 900px) { .duo { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
.duo h2 { margin-top: 4px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ph .sub { margin-bottom: 10px; }
.empty { padding: 20px 12px; text-align: center; color: var(--ink2); border: 1px dashed var(--axis); border-radius: 10px; font-size: 14px; }
.empty p { margin: 0 auto 10px; max-width: 44ch; }
.chart .dlabel { fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--card); stroke-width: 3; stroke-linejoin: round; }
.cmpwrap { overflow-x: auto; }
.cmp { display: grid; grid-template-columns: minmax(104px, 1.9fr) repeat(4, minmax(54px, 1fr)); font-size: 13px; }
.cmp .h { font-size: 12px; color: var(--ink2); font-weight: 600; padding: 0 8px 6px 0; border-bottom: 1px solid var(--axis); }
.cmp .c { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--grid); min-width: 0; }
.cmp .name { display: flex; gap: 8px; align-items: flex-start; }
.cmp .name b { display: block; font-weight: 600; overflow-wrap: break-word; }
/* On a phone each club's name gets its own row, with its four figures below. */
@media (max-width: 640px) {
  .cmp { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cmp .h.club { display: none; }
  .cmp .name { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 2px; }
  td.club { white-space: normal; min-width: 96px; }
  .bcell .track.ctr { display: none; }
}
.cmp .name small { display: block; color: var(--ink2); font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; margin-top: 5px; }
.x { margin-left: auto; border: 0; background: transparent; color: var(--ink2); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 4px; }
.mv { font-weight: 600; font-variant-numeric: tabular-nums; }
/* In-cell bars: a track, and a fill. Centred (ctr) bars grow either way from zero. */
.mbar, .track { position: relative; display: block; height: 8px; border-radius: 4px; background: var(--grid); }
.mbar { margin-top: 5px; }
.mbar i, .track i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--c, var(--accent)); }
.ctr::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink2); opacity: .6; }
.ctr i.pos { left: 50%; border-radius: 0 4px 4px 0; }
.ctr i.neg { left: auto; right: 50%; border-radius: 4px 0 0 4px; }
.track.ctr i.neg { background: var(--bad); }
.bcell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bcell .track { width: 84px; flex: none; }
@media (max-width: 640px) { .bcell .track { width: 44px; } }
.tablewrap.tall { max-height: 640px; overflow: auto; }
.odds { display: inline-block; min-width: 2.4em; padding: 1px 6px; border-radius: 6px; text-align: right;
  background: color-mix(in srgb, var(--s1) calc(var(--p) * 0.5%), transparent); }
.odds.zero { color: var(--ink2); }
details.more { margin: 14px 0; }
details.more > summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
details.more ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.5; }
th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button.sort:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
th .ar { font-size: 10px; width: 8px; }
.tick { width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1.5px solid var(--axis); background: transparent; cursor: pointer; vertical-align: middle; }
.tick[aria-checked="true"] { border-color: transparent; background: var(--c); }
tr.picked td { background: var(--accent-wash); }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--card); padding: 8px 10px; border-radius: 8px; font-size: 12px; max-width: 260px; box-shadow: 0 4px 16px rgba(0, 0, 0, .22); }
.tip .t { font-weight: 600; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:first-child { opacity: .75; }
.tip .r span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
@media (forced-colors: active) { .mbar i, .track i, .tick[aria-checked="true"], .sw { forced-color-adjust: none; } }
/* Stacked 100% bars: label, bar, key figure. On a phone the bar goes under the label. */
.stacks { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.skeys { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin: 0 0 8px; }
.srow { display: grid; grid-template-columns: minmax(90px, 210px) minmax(0, 1fr) 9ch; gap: 10px; align-items: center; padding: 4px 2px; font-size: 13px; border-radius: 6px; }
.srow.click { cursor: pointer; }
.srow.click:hover, .srow.hl { background: var(--accent-wash); }
.sl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl small { color: var(--ink2); margin-left: 6px; }
.sbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--grid); }
.sbar i { display: block; height: 100%; flex: none; }
.sbar i + i { box-shadow: inset 1px 0 0 var(--card); }
.sv { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12px; text-align: right; white-space: nowrap; }
@media (max-width: 640px) {
  .srow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
  .srow .sbar { grid-column: 1 / -1; grid-row: 2; }
}
/* Heatmap table: club column stays put while the age groups scroll. */
.hm td.hc { text-align: center; font-variant-numeric: tabular-nums; min-width: 62px; }
.hm td.hc.faint { color: var(--muted); }
.hm .c { position: sticky; left: 0; background: var(--card); z-index: 1; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.hm thead th.c { z-index: 3; }
.hm th { text-align: center; }
.hm tr.click:hover td.c { text-decoration: underline; }
.ramp { display: inline-block; width: 110px; height: 10px; border-radius: 3px; vertical-align: -1px; margin: 0 6px; }
.chart .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
h3 { font-size: 14px; margin: 16px 0 6px; }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand">VJBL results</div>
    <select id="season" aria-label="Season"></select>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#results">Results</a><a href="#ladders">Ladders</a><a href="#rankings">Rankings</a>
    <a href="#clubs">Clubs</a><a href="#grading">Grading</a><a href="#odds" hidden>Odds</a><a href="#players">Players</a><a href="#teams">Teams</a>
  </nav>
</div>
<main id="main"><p class="note">Loading…</p></main>
<footer id="foot">Unofficial archive of VJBL results from PlayHQ.</footer>
<script>
"use strict";
// ---------- helpers ----------------------------------------------------------
const MAX = 60;  // cards/rows shown before "Show more"
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(9)) {
    if (kid == null || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("vjbl:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("vjbl:" + k, JSON.stringify(v)); } catch (e) {} },
};
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
const uniq = (xs) => [...new Set(xs)];
// No sign on a value that rounds to zero (so never "−0.0").
const signed = (x, d = 1) => (x == null || isNaN(x)) ? "–" : (+Math.abs(x).toFixed(d) === 0 ? "" : x > 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const pct = (x) => (x == null || isNaN(x)) ? "–" : Math.round(x) + "%";
const f1 = (x) => (x == null || isNaN(x)) ? "–" : x.toFixed(1);
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const avg = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(iso, year = true) {
  if (!iso) return "Date to be confirmed";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DAYS[dt.getDay()]} ${d} ${MONTHS[m - 1]}` + (year ? ` ${y}` : "");
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtTime(t) {
  if (!t) return "";
  let [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}

// ---------- state -------------------------------------------------------------
const S = {
  seasons: [], folder: null, D: null,
  f: Object.assign({ age: "", gender: "", club: "", show: "results", q: "", phase: "", grade: "",
                     scale: "total", sort: "ppg", min: 1, pq: "", cmin: 1, csort: { k: "win", dir: -1 },
                     cview: "overview", hmetric: "win", fmetric: "margin", smetric: "win", gphase: "", opool: "1-6" }, store.get("filters", {})),
  myClub: store.get("myClub", ""),
  cmp: loadCmp(),  // clubs picked to compare on the Clubs page, and their colour slots
  cmpMsg: "",
  limit: MAX,
};
function setF(k, v) { S.f[k] = v; S.limit = MAX; store.set("filters", S.f); render(); }
function loadCmp() {
  const c = store.get("cmp", null);
  return c && Array.isArray(c.sel) && c.slot && typeof c.slot === "object" ? c : { sel: [], slot: {} };
}

// Hover card for chart dots.
const TIP = el("div", { class: "tip", role: "tooltip", hidden: true });
document.body.append(TIP);
function hideTip() { TIP.hidden = true; }
function showTip(node, x, y) {
  TIP.replaceChildren(node); TIP.hidden = false;
  const r = TIP.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  TIP.style.left = Math.max(8, left) + "px"; TIP.style.top = Math.max(8, top) + "px";
}

// ---------- data --------------------------------------------------------------
async function loadJSON(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(path + ": " + r.status);
  return r.json();
}
function decode(raw) {
  const D = { raw, season: raw.season, label: raw.label, updated: raw.updated, site: raw.site };
  D.grades = raw.grades.map(([name, age, gender, phase, base], i) => ({ i, name, age, gender, phase, base }));
  D.teams = raw.teams.map(([name, club, age, gender], i) => ({ i, name, club: club >= 0 ? raw.clubs[club] : "", age, gender }));
  D.games = raw.games.map((r) => ({
    date: r[0], time: r[1], grade: D.grades[r[2]], round: r[3], home: D.teams[r[4]], away: D.teams[r[5]],
    hs: r[6], as: r[7], st: r[8], venue: r[9] >= 0 ? raw.venues[r[9]] : "", court: r[10], id: r[11],
    forfeit: !!r[12], w: r[13], gone: !r[14],
  }));
  D.tg = [];  // one row per team per final game
  for (const g of D.games) {
    g.sides = [];
    if (g.st !== "F") continue;
    for (const [me, op, pf, pa, win] of [[g.home, g.away, g.hs, g.as, 1], [g.away, g.home, g.as, g.hs, 2]]) {
      const res = g.w === win ? "W" : g.w === 0 ? "D" : "L";
      const scored = pf != null && pa != null && !g.forfeit;
      const row = { g, team: me, opp: op, pf, pa, res, margin: scored ? pf - pa : null };
      D.tg.push(row);
      g.sides.push(row);
    }
  }
  D.ladders = raw.ladders.map((r) => ({
    grade: D.grades[r[0]], pool: r[1], pos: r[2], team: D.teams[r[3]], P: r[4], W: r[5], L: r[6], Dr: r[7],
    PF: r[8], PA: r[9], pct: r[10], pts: r[11], after: r[12], gone: !r[13],
  }));
  D.rating = new Map(raw.ratings.map(([ti, rating, rank, of, group]) => [ti, { rating, rank, of, group }]));
  D.groups = raw.groups || {};
  D.players = (raw.players || []).map(([name, num, ti, games, pts, ft, two, three, fouls]) => ({
    name, num, team: D.teams[ti], games, pts, ft, two, three, fouls, ppg: pts / games, fpg: fouls / games }));

// ---------- Grading -----------------------------------------------------------
// How close the games are: grading should put teams with teams of their own standard.
const marginOf = (g) => Math.abs(g.hs - g.as);
const closeness = (gs) => {  // [close, in between, blowouts]
  let c = 0, b = 0;
  for (const g of gs) { const x = marginOf(g); if (x <= CLOSE) c++; else if (x > BLOWOUT) b++; }
  return [c, gs.length - c - b, b];
};
const CLOSE_KEYS = [{ name: `Close (${CLOSE} or fewer)`, colour: "var(--s1)" }, { name: "In between", colour: "var(--other)" },
  { name: `Blowout (more than ${BLOWOUT})`, colour: "var(--s2)" }];
function viewGrading(D) {
  const out = [el("h1", {}, "Grading check"), el("p", { class: "sub" }, "How close the games are. Grading tries to put every team with " +
    `teams of its own standard, so most games should be close. Close: won by ${CLOSE} points or fewer; blowout: by more than ${BLOWOUT}. ` +
    "Forfeits aren't counted.")];
  const phases = uniq(D.grades.map((g) => g.phase)).sort(natural);
  out.push(el("div", { class: "filters" }, sel("Age", "age", D.ages), sel("Gender", "gender", D.genders), sel("Competition", "gphase", phases)));
  const scored = D.games.filter((g) => g.st === "F" && !g.forfeit && g.hs != null && g.as != null && (!S.f.gphase || g.grade.phase === S.f.gphase));
  const ok = (g) => (!S.f.age || g.grade.age === S.f.age) && (!S.f.gender || g.grade.gender === S.f.gender);
  const games = scored.filter(ok);
  if (!games.length) return out.concat(el("p", { class: "note" }, "No scored games in this selection yet."));
  const [c, , b] = closeness(games), n = games.length;
  out.push(tiles([["Scored games", n.toLocaleString()], ["Close games", pct(c / n * 100), `won by ${CLOSE} or fewer`],
    ["Blowouts", pct(b / n * 100), `won by more than ${BLOWOUT}`], ["Median margin", String(median(games.map(marginOf))), "points"]]));

  out.push(el("h2", {}, "By age group"), el("p", { class: "sub" }, "Every age group, for the competition chosen. Tap one to look at it."));
  const ageRows = [];
  for (const a of D.ages) for (const gd of D.genders) {
    const gs = scored.filter((g) => g.grade.age === a && g.grade.gender === gd);
    if (!gs.length) continue;
    const parts = closeness(gs), sh = share(parts);
    ageRows.push({ label: `${a} ${gd}`, sub: plural(gs.length, "game"), parts, value: `${pct(sh[2])} blowouts`,
      tip: `${a} ${gd}: ${pct(sh[0])} close, ${pct(sh[1])} in between, ${pct(sh[2])} blowouts`,
      hl: a === S.f.age && gd === S.f.gender, onclick: () => { S.f.gender = gd; setF("age", a); } });
  }
  out.push(stackBars(CLOSE_KEYS, ageRows));

  const weeks = uniq(games.filter((g) => g.date).map((g) => weekOf(g.date))).sort();
  if (weeks.length > 1) {
    out.push(el("h2", {}, "Week by week"), el("p", { class: "sub" }, "If grading is working, blowouts get rarer as teams move to pools of their own standard."));
    out.push(stackBars(CLOSE_KEYS, weeks.map((w) => {
      const gs = games.filter((g) => g.date && weekOf(g.date) === w), parts = closeness(gs), sh = share(parts);
      return { label: `Week of ${fmtDate(w, false)}`, sub: plural(gs.length, "game"), parts, value: `${pct(sh[2])} blowouts`,
        tip: `${pct(sh[0])} close, ${pct(sh[1])} in between, ${pct(sh[2])} blowouts` };
    })));
  }

  out.push(el("h2", {}, "How big the margins are"), el("p", { class: "sub" }, "Games by the points between the teams."));
  out.push(histogram(games.map(marginOf)));

  const byGrade = new Map();
  for (const g of games) { if (!byGrade.has(g.grade)) byGrade.set(g.grade, []); byGrade.get(g.grade).push(g); }
  const rows = [...byGrade.entries()].map(([gr, gs]) => {
    const [cc, , bb] = closeness(gs), ms = gs.map(marginOf);
    return { gr, n: gs.length, nb: bb, med: median(ms), close: cc / gs.length * 100, blow: bb / gs.length * 100, max: Math.max(...ms) };
  }).sort((a, b) => b.nb - a.nb || b.blow - a.blow || natural(a.gr.name, b.gr.name));
  out.push(el("h2", {}, "Grades with the most blowouts"), el("p", { class: "sub" }, "Tap a grade to open its ladder."));
  const shown = rows.slice(0, S.limit);
  out.push(table([
    { h: "Grade", v: (r) => r.gr.name }, { h: "Games", n: 1, v: (r) => r.n }, { h: "Median", n: 1, wide: 1, v: (r) => r.med },
    { h: "Close", n: 1, wide: 1, v: (r) => pct(r.close) },
    { h: "Blowouts", n: 1, v: (r) => el("div", { class: "bcell" }, el("span", {}, pct(r.blow)),
      el("span", { class: "track" }, el("i", { style: `width:${r.blow}%;background:var(--s2)` }))) },
    { h: "Biggest", n: 1, wide: 1, v: (r) => r.max },
  ], shown, { onRow: (r) => {
    Object.assign(S.f, { age: r.gr.age, gender: r.gr.gender, phase: r.gr.phase, grade: r.gr.name });
    store.set("filters", S.f); location.hash = "ladders";
  } }));
  out.push(more(rows.length, shown.length));
  return out;
}
// Games by margin: 0–5, 6–10, ... 46–50, 51+, coloured close / in between / blowout.
function histogram(values) {

  for (const v of values) bins[Math.min(10, v <= 5 ? 0 : Math.ceil(v / 5) - 1)].n++;

const MIX_KEYS = [{ name: "Free throws", colour: "var(--s4)" }, { name: "2-pointers", colour: "var(--s1)" }, { name: "3-pointers", colour: "var(--s2)" }];

    const s = by.get(k); s[0] += p.ft; s[1] += 2 * p.two; s[2] += 3 * p.three;
  }
  if (!by.size) return el("p", { class: "note" }, "No player stats in this selection.");
  return stackBars(MIX_KEYS, [...by.entries()].sort((a, b) => natural(a[0], b[0])).map(([k, parts]) => {
    const sh = share(parts);
    return { label: k, sub: plural(parts[0] + parts[1] + parts[2], "point"), parts, value: `3P ${pct(sh[2])}`,
      tip: `${k}: ${pct(sh[0])} free throws, ${pct(sh[1])} 2-pointers, ${pct(sh[2])} 3-pointers` };
  }));
}
const SPREAD_KEYS = [{ name: "Top scorer", colour: "var(--s1)" }, { name: "Second", colour: "var(--s3)" },
  { name: "Third", colour: "var(--s4)" }, { name: "Everyone else", colour: "var(--other)" }];

  let teams = [...by.entries()].map(([team, ps]) => {

    return { team, ps, tot, games: Math.max(...ps.map((p) => p.games)),

  }).filter((t) => t.ps.filter((p) => p.pts > 0).length >= 3)  // fewer: a scoresheet entered without its scorers
    .sort((a, b) => b.parts[0] / b.tot - a.parts[0] / a.tot || natural(a.team.name, b.team.name));
  if (!teams.length) return el("p", { class: "note" }, "No player stats in this selection.");
  if (!S.f.club) teams = teams.slice(0, 25);
  return stackBars(SPREAD_KEYS, teams.map((t) => ({
    label: t.team.name, sub: plural(t.games, "game"), parts: t.parts, value: `Top ${pct(t.parts[0] / t.tot * 100)}`, hl: isMine(t.team),
    tip: `${t.team.name}: ` + t.ps.slice(0, 3).map((p) => `${p.name} ${p.pts}`).join(", ") + ` of ${t.tot} points`,
    onclick: () => { location.hash = "team/" + encodeURIComponent(t.team.name); } })));
}

    const pick = document.getElementById("season");
    pick.replaceChildren(...S.seasons.map((s) => el("option", { value: s.folder }, s.label)));
    const want = store.get("season", S.seasons[0].folder);
    const folder = S.seasons.some((s) => s.folder === want) ? want : S.seasons[0].folder;
    pick.value = folder;
    pick.addEventListener("change", (e) => loadSeason(e.target.value));
    window.addEventListener("hashchange", () => { S.limit = MAX; render(); window.scrollTo(0, 0); });
    let lastW = window.innerWidth, t = null;  // redraw the charts for a new screen width
    window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => {
      if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; render(); } }, 250); });
    await loadSeason(folder);
  } catch (e) {
    document.getElementById("main").replaceChildren(el("p", { class: "note" }, "Couldn't load the data: " + e.message));
  }
}
start();
</script>
</body>
</html>
